<h1>Sportello regionale aperto da anni</h1>
<p>Lo sportello resta aperto per la presentazione delle domande da parte delle piccole imprese con sede operativa in Toscana, nei limiti delle risorse disponibili.</p>
<p>Le domande si presentano in qualunque momento sulla piattaforma della Regione.</p>
