[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# I test marcati 'modello' chiamano l'API e costano: si lanciano solo a mano,
# con python -m pytest -m modello
markers = ["modello: chiama il modello vero (API a pagamento)"]
addopts = "-m 'not modello'"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "DTZ", "ISC"]

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["E402"]